[General]

; 1 = knocking is on. 0 = every door behaves as it does without this mod.
bEnabled=1

; The day, on the game's 24-hour clock. Outside these hours is night, and iNightPenalty applies.
iDayStartHour=8
iDayEndHour=20

[Decision]

; Who lets you in. The one who answers is the resident with the best relationship to you, adults before children.
; A Knock lets you in when their relationship rank to you is iFriendRank or more (1 friend, 2 confidant, 3 ally, 4 lover),
; or when your Speech skill is at least iKnockSpeech plus the penalties below. Otherwise they refuse, and you may
; Persuade (your Speech against iPersuadeSpeech plus the same penalties) or Intimidate (your level, raised by your
; Speech, against their level scaled by their confidence, the game's own fIntimidateConfidenceMult settings) once each.
iFriendRank=1
iKnockSpeech=50
iPersuadeSpeech=30
; Added to the Speech needed: at night; when the one answering was asleep.
iNightPenalty=15
iAsleepPenalty=15
; Added when your bounty in their hold is iBountyGold or more (0 = bounties do not count).
iBountyGold=1
iBountyPenalty=25
; Added when you have been seen stealing goods worth iThiefGold or more in their hold (0 = thefts do not count).
iThiefGold=1
iThiefPenalty=20
; Added for each rank below acquaintance: rival 1, foe 2, enemy 3, archnemesis 4.
iDislikePenalty=15
; How far your intimidation must beat theirs. Negative makes it easier.
iIntimidateMargin=0
; Game hours after a refusal before a new Knock starts over, with Persuade and Intimidate offered again.
iRetryHours=1

[Voice]

; The vanilla topics the resident speaks through the door, in their own voice. Plugin|FormID (hex, without the load-order digits).
; The game picks the line within the topic that fits their voice type.
; Let in: DialogueGeneric, "I'll let you stay. This time." and its voice variants.
sLetInTopic=Skyrim.esm|0x039C2A
; Refused: DialogueGeneric, "You need to leave." and its voice variants.
sRefuseTopic=Skyrim.esm|0x06AEA2
; How loud the answer through the door is, in percent of the game's own loudness (0 to 100). 100 = as the game plays it.
iVoiceVolume=100

[Sound]

; The knock sound. On the settings page too.
; 3 = wood: you bang on the door (the game's IdleMT_DoorBang) and a wooden knock (FSTPlayerWoodBarefootSprintL) sounds
;     five times; moving away or drawing a weapon stops the knocks still to come. Idea and timings by kialiva.
; 1 = sharp only: the end of the game's Labyrinthian door knock, its two sharp knocks, from the mod's own sound file.
; 2 = full: the sound descriptor in sKnockSound below, whole, stone grinding included.
; 0 = off: no knock sound.
iKnockSound=3
; The sound descriptor "full" plays. Plugin|FormID (hex, without the load-order digits). Empty = none.
; Skyrim.esm has no wooden-door knock descriptor; this is DRSStoneLabyrinthianKnock, its one door knock.
sKnockSound=Skyrim.esm|0x10080A

[Debug]

; Sets the level of detail in the log: 0 = trace, 1 = debug, 2 = info, 3 = warning, 4 = error, 5 = critical error
uLogLevel=2

[Exclusions]

; Doors to leave alone. One Exclude= line each, as Plugin.esp|FormID (hex, without the load-order digits) or as an editor ID.
; It may name the door, its base object, its other half, the destination cell or the destination location.
; A plugin that is not in your load order is skipped. The starting list is places a quest locks on purpose.

